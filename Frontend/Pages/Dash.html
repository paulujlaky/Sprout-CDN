<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  
  <title>Sprout CDN</title>
  <link rel="icon" href="/Assets/Logos/SproutCDNLogo.ico" type="image/x-icon">

  <link rel="stylesheet" href="/Out/Styles/Main.min.css">
  <script type="module" src="/Out/Scripts/Main.js"></script> <!-- also minified -->

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  
  <link rel="stylesheet" href="https://use.typekit.net/pge8obf.css">

</head>

<body>

  <div class="Container Transparent Full Center DashLoading">

    <div class="Container Transparent VerticalFlex DashLoadingContainer">

      <div class="Container HorizontalFlex DashHeaderBranding DashLoadingVariant">

        <img src="/Assets/Logos/Sprout.svg" alt="Sprout" class="DashHeaderImage" draggable="false">

        <div class="DashHeaderTitle">CDN</div>

      </div>

      <div class="DashNoAccessMessage" style="display: none;">You do not have access to the Sprout CDN</div>

    </div>

  </div>

  <header class="Container Glass DashHeader">

    <div class="Container HorizontalFlex DashHeaderBranding">

      <img src="/Assets/Logos/Sprout.svg" alt="Sprout" class="DashHeaderImage" draggable="false">

      <div class="DashHeaderTitle">CDN</div>

    </div>

    <div class="Container VerticalFlex DashHeaderMessage">

      <div class="DashHeaderMessageTextLarge">Browsing <span class="DashCodeInfill DashHeaderCurrentDir"></span></div>
      <div class="DashHeaderMessageTextMedium Welcome">Welcome<span class="DashHeaderWelcomeBack"> Back</span>, <span class="DashHeaderMessageUser"></span></div>

    </div>

    <div class="Container HorizontalFlex DashHeaderAccount">

      <ion-icon name="person-circle" class="DashHeaderAccountIcon"></ion-icon>
      
    </div> 

  </header>

  <main class="DashMain">


  </main>

  <footer class="Container Glass DashFooter">

    <div class="Container Transparent HorizontalFlex DashFooterButtonSection">

      <Button disabled class="DashFooterButton NavigationBackward">

        <ion-icon name="chevron-back"></ion-icon>      

      </Button>

      <Button disabled class="DashFooterButton NavigationForward">

        <ion-icon name="chevron-forward"></ion-icon>

      </Button>

    </div>

    <div class="Container Transparent HorizontalFlex DashFooterMessageSection">

        <div class="Container Transparent Center DashFooterMessageLoadingIndicator">

          <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12,4a8,8,0,0,1,7.89,6.7A1.53,1.53,0,0,0,21.38,12h0a1.5,1.5,0,0,0,1.48-1.75,11,11,0,0,0-21.72,0A1.5,1.5,0,0,0,2.62,12h0a1.53,1.53,0,0,0,1.49-1.3A8,8,0,0,1,12,4Z"><animateTransform attributeName="transform" type="rotate" dur="0.75s" values="0 12 12;360 12 12" repeatCount="indefinite"/></path></svg>
        
        </div>

        <div class="Container Transparent Center DashFooterMessageIcon">
          
        </div>

        <div class="DashFooterMessageText">Loading...</div>

    </div>

    <div class="Container Transparent HorizontalFlex DashFooterButtonSection">

      <Button class="DashFooterButton NewFile">
        
        <ion-icon name="document"></ion-icon>

        <span class="DashFooterButtonText">New File</span>
      
      </Button>

      <Button class="DashFooterButton NewFolder">

        <ion-icon name="folder"></ion-icon>

        <span class="DashFooterButtonText">New Folder</span>
        
      </Button>

    </div>

  </footer>

  <!-- Context Menu -->

  <div class="DashContextMenu" style="display: none;">

  </div>

  <!-- Dialogs -->

  <div class="DashDialogOverlay" style="display: none;"></div>

  <!-- Create Directory Dialog -->

  <dialog class="Container VerticalFlex DashDialog DashCreateDirDialog" style="display: none;">

      <div class="Container Transparent HorizontalFlex DashDialogHeader">

        <div class="DashDialogTitle">Create New Folder</div>

      </div>

      <div class="Container Transparent VerticalFlex DashDialogBody">

        <div class="DashDialogInputContainer">

          <input type="text" id="DirName" class="DashDialogInput" placeholder="Enter Folder Name">

        </div>

        <div class="DashDialogInputContainer Smaller">

          <label for="DirVisibility" class="DashDialogInputLabel">Private</label>

          <Toggle id="DirPrivate">

            <ion-icon name="checkmark-outline"></ion-icon>

          </Toggle>
          
        </div>

      </div>

      <div class="Container Transparent HorizontalFlex DashDialogFooter">

        <Button class="DashDialogButton DashDialogButtonCancel">Cancel</Button>
        <Button class="DashDialogButton DashDialogButtonSubmit">Create</Button>

      </div>

  </dialog>

  <!-- View Account Dialog -->

  <dialog class="Container VerticalFlex DashDialog DashViewAccountDialog" style="display: none;">

    <div class="Container Transparent HorizontalFlex DashDialogHeader">

      <div class="DashDialogTitle">Sprout Account</div>

    </div>

    <div class="Container Transparent HorizontalFlex DashDialogBody AccountView">

      <div class="Container Transparent Center DashDialogAccountIcon">

        <ion-icon name="person-circle" class="DashDialogAccountIcon"></ion-icon>

      </div>

      <div class="Container Transparent VerticalFlex DashDialogAccountInfo" style="align-items: start;">

          <div class="DashDialogAccountInfoItem DashHeaderMessageUser">Username</div>
          <div class="DashDialogAccountInfoItem DashHeaderMessageEmail">Username</div>

      </div>

    </div>

    <div class="Container Transparent HorizontalFlex DashDialogFooter">

      <Button class="DashDialogButton DashDialogButtonCancel">Close</Button>
      <Button class="DashDialogButton DashDialogButtonCancel" id="LogOut">Log Out</Button>

    </div>

  </dialog>

  <!-- QR Code Dialog -->

  <dialog class="Container VerticalFlex DashDialog DashQRDialog" style="display: none;">

    <div class="Container Transparent HorizontalFlex DashDialogHeader QRDialogHeader">

      <div class="DashDialogTitle">QR Code</div>

    </div>

    <div class="Container Transparent HorizontalFlex DashDialogBody">

      <div class="Container Transparent Center DashQRCodeContainer" style="padding: 0;">

        <img src="" alt="QR Code" class="DashQRCode">

      </div>

    </div>

    <div class="Container Transparent HorizontalFlex DashDialogFooter">

      <Button class="DashDialogButton DashDialogButtonCancel">Close</Button>

    </div>
  
</body>

</html>
