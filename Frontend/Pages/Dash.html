<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sprout CDN</title>
  <link rel="icon" href="../Assets/Logos/SproutCDNLogo.ico" type="image/x-icon">

  <link rel="stylesheet" href="../Out/Styles/Main.min.css">
  <script type="module" src="../Out/Scripts/Main.js"></script> <!-- also minified -->

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  
  <link rel="stylesheet" href="https://use.typekit.net/pge8obf.css">

</head>

<body>

  <div class="Container Transparent Full Center DashLoading">

    <div class="Container HorizontalFlex DashHeaderBranding DashLoadingVariant">

      <img src="../Assets/Logos/Sprout.svg" alt="Sprout" class="DashHeaderImage" draggable="false">

      <div class="DashHeaderTitle">CDN</div>

    </div>

  </div>

  <header class="Container Glass DashHeader">

    <div class="Container HorizontalFlex DashHeaderBranding">

      <img src="../Assets/Logos/Sprout.svg" alt="Sprout" class="DashHeaderImage" draggable="false">

      <div class="DashHeaderTitle">CDN</div>

    </div>

    <div class="Container VerticalFlex DashHeaderMessage">

      <div class="DashHeaderMessageTextLarge">Browsing <span class="DashCodeInfill DashHeaderCurrentDir"></span></div>
      <div class="DashHeaderMessageTextMedium Welcome">Welcome<span class="DashHeaderWelcomeBack"> Back</span>, <span class="DashHeaderMessageUser"></span></div>

    </div>

    <div class="Container HorizontalFlex DashHeaderAccount">

      <ion-icon name="person-circle" class="DashHeaderAccountIcon"></ion-icon>
      
    </div> 

  </header>

  <main class="DashMain">


  </main>

  <footer class="Container Glass DashFooter">

    <div class="Container Transparent HorizontalFlex DashFooterButtonSection">

      <Button class="DashFooterButton">

        <ion-icon name="chevron-back"></ion-icon>      

      </Button>

      <Button class="DashFooterButton">

        <ion-icon name="chevron-forward"></ion-icon>

      </Button>

    </div>

    <div class="Container Transparent HorizontalFlex DashFooterButtonSection">

      <Button disabled class="DashFooterButton">
        
        <ion-icon name="document"></ion-icon>

        <span class="DashFooterButtonText">New File</span>
      
      </Button>

      <Button class="DashFooterButton">

        <ion-icon name="folder"></ion-icon>

        <span class="DashFooterButtonText">New Folder</span>
        
      </Button>

    </div>

  </footer>

</body>

</html>
